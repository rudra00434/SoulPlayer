<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SoulPlayer Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0b0f19 0%, #1a1025 50%, #0d1b2a 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 {
            top: -10%; left: -10%; width: 400px; height: 400px;
            background: radial-gradient(circle, #ff007f, transparent 70%);
        }
        .blob-2 {
            bottom: -10%; right: -10%; width: 500px; height: 500px;
            background: radial-gradient(circle, #00f0ff, transparent 70%);
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        .material-input-container {
            position: relative;
            width: 100%;
        }

        .material-input-container input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px 8px 0 0;
            color: white;
            padding: 16px 16px 8px 16px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .material-input-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00f0ff, #ff007f);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .material-input-container:focus-within::after {
            width: 100%;
        }

        .material-input-container input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-bottom-color: transparent;
        }

        .ripple {
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
        }
        .ripple-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .glass-card {
            background: rgba(20, 25, 40, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 240, 255, 0.1);
        }
    </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center selection:bg-[#00f0ff] selection:text-[#0b0f19]">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="glass-card rounded-[2rem] p-10 w-full max-w-md relative overflow-hidden group hover:shadow-[0_0_40px_rgba(255,0,127,0.15)] transition-shadow duration-500">
        <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>

        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400 mb-2 drop-shadow-lg">
                Join SoulPlayer<span class="text-[#00f0ff] animate-pulse">.</span>
            </h1>
            <p class="text-gray-400 font-medium">Create an account to build your library.</p>
        </div>

        <form method="POST" class="flex flex-col gap-6 relative z-10">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="bg-red-500/10 border-l-4 border-red-500 rounded-r-lg p-4 text-red-400 text-sm font-medium shadow-inner flex items-center gap-3">
                <i class="fa-solid fa-circle-exclamation text-lg"></i>
                <p>{{ form.non_field_errors.0 }}</p>
            </div>
            {% endif %}

            {% for field in form %}
            <div class="flex flex-col">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">{{ field.label }}</label>
                <div class="material-input-container">
                    {{ field }}
                </div>
                {% if field.errors %}
                <p class="text-[#ff007f] text-xs font-semibold mt-1.5 ml-1 flex items-center gap-1">
                    <i class="fa-solid fa-circle-xmark"></i> {{ field.errors.0 }}
                </p>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit"
                class="ripple mt-6 w-full bg-gradient-to-r from-[#00f0ff] to-[#3be2c8] hover:from-[#00f0ff] hover:to-[#00c8ff] text-[#0b0f19] font-black uppercase tracking-[0.2em] text-sm py-4 rounded-xl shadow-[0_10px_20px_rgba(0,240,255,0.3)] hover:shadow-[0_15px_30px_rgba(0,240,255,0.4)] hover:-translate-y-1 transition-all duration-300">
                SIGN UP
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-400 font-medium">
            Already have an account? 
            <a href="{% url 'user_login' %}" class="relative text-white font-bold group/link inline-block">
                <span class="relative z-10 hover:text-[#00f0ff] transition-colors duration-300">Log in</span>
                <span class="absolute bottom-0 left-0 w-full h-[2px] bg-[#00f0ff] origin-left transform scale-x-0 group-hover/link:scale-x-100 transition-transform duration-300 ease-out"></span>
            </a>
        </p>
    </div>

    <script>
        document.querySelectorAll('.ripple').forEach(button => {
            button.addEventListener('click', function (e) {
                const circle = document.createElement('span');
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;

                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - button.getBoundingClientRect().left - radius}px`;
                circle.style.top = `${e.clientY - button.getBoundingClientRect().top - radius}px`;
                circle.classList.add('ripple-circle');

                const ripple = button.querySelector('.ripple-circle');
                if (ripple) {
                    ripple.remove();
                }

                button.appendChild(circle);
            });
        });
    </script>
</body>

</html>
