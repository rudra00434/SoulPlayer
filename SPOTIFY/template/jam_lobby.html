{% extends 'index.html' %}
{% load static %}

{% block content %}
<div class="px-10 pb-32 pt-8 min-h-[85vh] flex items-center justify-center relative overflow-hidden">
    <!-- Immersive Background Orbs -->
    <div class="absolute inset-0 bg-gradient-to-br from-[#1e293b] via-[#0f172a] to-[#020617] z-0 pointer-events-none"></div>
    <div class="absolute top-1/4 left-1/3 w-[500px] h-[500px] bg-[#3be2c8] rounded-full mix-blend-screen filter blur-[150px] opacity-20 z-0 animate-[pulse_10s_infinite] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-purple-600 rounded-full mix-blend-screen filter blur-[150px] opacity-20 z-0 animate-[pulse_8s_infinite_reverse] pointer-events-none"></div>

    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8 relative z-10">
        <!-- Intro Hero -->
        <div class="flex flex-col justify-center text-center md:text-left">
            <h1 class="text-5xl md:text-6xl font-black tracking-tighter text-white mb-6 leading-tight drop-shadow-xl">
                Experience<br>
                Music<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#3be2c8] to-purple-500 animate-pulse">Together.</span>
            </h1>
            <p class="text-gray-400 font-medium text-lg mb-8 max-w-sm mx-auto md:mx-0">Host a Live Jam or join your friends. Chat in real-time, sync your audio, and vibe to the same beat no matter where you are.</p>
        </div>

        <!-- The Glass Interface -->
        <div class="bg-[#0f172a]/60 backdrop-blur-3xl border border-white/10 p-10 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] flex flex-col items-center relative overflow-hidden group">
            <div class="absolute -top-32 -right-32 w-64 h-64 bg-[#3be2c8]/20 rounded-full blur-[80px] group-hover:bg-[#3be2c8]/30 transition-colors duration-700"></div>

            <h2 class="text-2xl font-bold text-white mb-8 tracking-wide font-mono z-10">Select Portal</h2>

            <button onclick="createRoom()" class="w-full relative py-4 px-6 bg-gradient-to-r from-[#3be2c8] to-[#2cdbbd] rounded-2xl font-black text-[#0b0f19] tracking-[0.2em] uppercase text-sm shadow-[0_0_20px_rgba(59,226,200,0.4)] hover:shadow-[0_0_40px_rgba(59,226,200,0.6)] hover:scale-105 transition-all duration-300 z-10 mb-8 active:scale-95">
                <i class="fas fa-plus-circle mr-2 text-lg"></i> Create a Room
            </button>

            <div class="flex items-center w-full mb-8 z-10 opacity-50">
                <div class="flex-1 h-px bg-white/30"></div>
                <span class="px-3 text-xs font-bold text-white uppercase tracking-widest">or join</span>
                <div class="flex-1 h-px bg-white/30"></div>
            </div>

            <div class="w-full relative z-10">
                <div class="relative flex items-center">
                    <i class="fas fa-key absolute left-5 text-gray-500"></i>
                    <input type="text" id="join-code" placeholder="ENTER 6-DIGIT CODE" class="w-full bg-black/40 border border-white/10 rounded-2xl py-4 pl-12 pr-6 text-white text-center font-mono font-bold tracking-[0.3em] uppercase focus:outline-none focus:border-[#3be2c8] focus:ring-1 focus:ring-[#3be2c8] transition-all">
                </div>
                <button onclick="joinRoom()" class="w-full mt-4 py-4 px-6 bg-white/5 border border-white/10 rounded-2xl font-bold text-white tracking-[0.2em] uppercase text-sm hover:bg-white/10 hover:border-white/30 transition-all duration-300 active:scale-95">
                    <i class="fas fa-sign-in-alt mr-2 text-lg text-[#3be2c8]"></i> Enter Lobby
                </button>
            </div>
            
            <p id="error-msg" class="text-red-400 font-bold mt-4 text-sm hidden animate-bounce z-10"></p>
        </div>
    </div>
</div>

<script>
    function createRoom() {
        const btn = event.currentTarget;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin text-lg"></i>';
        
        fetch('/api/create_room/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({}) // Initial room has no song
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.href = `/jam/${data.room_code}/`;
            } else {
                showError(data.message || 'Failed to create room');
                btn.innerHTML = '<i class="fas fa-plus-circle mr-2 text-lg"></i> Create a Room';
            }
        }).catch(err => {
            showError('Network error');
            btn.innerHTML = '<i class="fas fa-plus-circle mr-2 text-lg"></i> Create a Room';
        });
    }

    function joinRoom() {
        const code = document.getElementById('join-code').value.toUpperCase().trim();
        if (code.length < 5) {
            showError("Invalid Code Length");
            return;
        }

        window.location.href = `/jam/${code}/`;
    }

    function showError(msg) {
        const p = document.getElementById('error-msg');
        p.innerText = msg;
        p.classList.remove('hidden');
        setTimeout(() => p.classList.add('hidden'), 3000);
    }
</script>
{% endblock %}
