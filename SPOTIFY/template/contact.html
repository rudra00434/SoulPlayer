{% extends 'index.html' %}
{% block content %}
<style>
    .blob {
        position: absolute; filter: blur(80px); z-index: 0; opacity: 0.5; animation: float 10s infinite ease-in-out alternate;
    }
    .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: radial-gradient(circle, #ff007f, transparent 70%); }
    .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: radial-gradient(circle, #00f0ff, transparent 70%); animation-delay: -5s; }
    
    .glass-card {
        background: rgba(20, 25, 40, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 240, 255, 0.1);
    }
    
    .material-input-container { position: relative; width: 100%; }
    .material-input-container input, .material-input-container textarea {
        width: 100%; background: rgba(255, 255, 255, 0.03); border: none; border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px 8px 0 0; color: white; padding: 16px 16px 8px 16px; font-size: 1rem; outline: none; transition: all 0.3s ease; resize: none;
    }
    .material-input-container::after {
        content: ''; position: absolute; bottom: 0; left: 50%; width: 0; height: 2px; background: linear-gradient(90deg, #00f0ff, #ff007f); transition: all 0.3s ease; transform: translateX(-50%);
    }
    .material-input-container:focus-within::after { width: 100%; }
    .material-input-container input:focus, .material-input-container textarea:focus { background: rgba(255, 255, 255, 0.08); border-bottom-color: transparent; }
    
    .ripple { position: relative; overflow: hidden; transform: translate3d(0, 0, 0); }
    .ripple-circle { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.4); transform: scale(0); animation: ripple-animation 0.6s linear; pointer-events: none; }
    @keyframes ripple-animation { to { transform: scale(4); opacity: 0; } }
</style>

<div class="px-10 pb-32 pt-10 min-h-screen relative overflow-hidden flex justify-center">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="glass-card rounded-[2rem] p-12 w-full max-w-2xl relative overflow-hidden z-10 transition-shadow duration-500 mt-4">
        <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
        
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400 mb-2 drop-shadow-lg">
                Contact Us<span class="text-[#00f0ff] animate-pulse">.</span>
            </h1>
            <p class="text-gray-400 font-medium text-sm">Have a question or want to partner with us? Drop a message!</p>
        </div>

        {% if messages %}
        <div class="mb-6">
            {% for message in messages %}
            <div class="bg-[#3be2c8]/10 border-l-4 border-[#3be2c8] rounded-r-lg p-4 text-[#3be2c8] text-sm font-medium shadow-inner flex items-center gap-3">
                <i class="fas fa-check-circle text-lg"></i>
                <p>{{ message }}</p>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="flex flex-col gap-6 relative z-10" action="{% url 'contact' %}">
            {% csrf_token %}
            
            <div class="flex flex-col">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Your Name</label>
                <div class="material-input-container">
                    <input type="text" name="name" required placeholder="John Doe" autocomplete="off">
                </div>
            </div>
            
            <div class="flex flex-col">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Your Email</label>
                <div class="material-input-container">
                    <input type="email" name="email" required placeholder="john@example.com" autocomplete="off">
                </div>
            </div>
            
            <div class="flex flex-col">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Message</label>
                <div class="material-input-container">
                    <textarea name="message" rows="4" required placeholder="Tell us what's on your mind..."></textarea>
                </div>
            </div>

            <button type="submit"
                class="ripple mt-4 w-full bg-gradient-to-r from-[#00f0ff] to-[#3be2c8] hover:from-[#00f0ff] hover:to-[#00c8ff] text-[#0b0f19] font-black uppercase tracking-[0.2em] text-sm py-4 rounded-xl shadow-[0_10px_20px_rgba(0,240,255,0.3)] hover:shadow-[0_15px_30px_rgba(0,240,255,0.4)] hover:-translate-y-1 transition-all duration-300">
                Send Message
            </button>
        </form>
    </div>
</div>

<script>
    document.querySelectorAll('.ripple').forEach(button => {
        button.addEventListener('click', function (e) {
            const circle = document.createElement('span');
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - button.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${e.clientY - button.getBoundingClientRect().top - radius}px`;
            circle.classList.add('ripple-circle');
            const ripple = button.querySelector('.ripple-circle');
            if (ripple) { ripple.remove(); }
            button.appendChild(circle);
        });
    });
</script>
{% endblock %}
